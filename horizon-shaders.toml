schema = 1
id = "lumen"
name = "Lumen"
version = "2.6.0"
api = "0.1"
description = "A cozy Photon-style shader: soft shadows, warm sky, volumetric clouds, light shafts, clear water with reflections, beautiful underwater, waving plants and coloured light. Original code."
authors = ["Lutziano888"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"
clouds = false
sun = false
stars = false

[vertex]
file = "vertex.wgsl"

[material]
file = "material.wgsl"
name = "Lighting"
fog = false

[weather]
file = "weather.wgsl"
name = "Rain and Snow"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_quality"
distance_option = "shadow_distance"

[reflection]
option = "reflections"

# Weiche Effekte in halber Aufloesung (ein Viertel der Pixel), jeweils in ein
# eigenes Ziel; fog und grade setzen sie in voller Aufloesung zusammen.
[[post]]
file = "post/clouds.wgsl"
name = "Clouds"
scale = 0.5
output = "cloud_tex"

[[post]]
file = "post/shafts.wgsl"
name = "Light Shafts"
scale = 0.5
output = "shaft_tex"

[[post]]
file = "post/fog.wgsl"
name = "Air and Fog"

[[post]]
file = "post/rays.wgsl"
name = "Sun Rays"
scale = 0.5
output = "ray_tex"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"
scale = 0.5
output = "glow_tex"

[[post]]
file = "post/grade.wgsl"
name = "Tonemapping"

# --- Options ---

[[pages]]
id = "main"
name = "Lumen"
items = ["quality", "page:performance", "page:light", "page:sky", "page:water", "page:image"]

[[pages]]
id = "performance"
name = "Graphics and Performance"
description = "A quality level that fits your PC, plus shadows and reflections, which cost the most performance."
items = ["quality", "shadows", "shadow_quality", "shadow_distance", "reflections", "anti_aliasing"]

[[pages]]
id = "light"
name = "Light and Shadows"
description = "Sun, shadows, sky light, torches and plants."
items = ["sun_strength", "shadow_softness", "ambient_strength", "ambient_blue", "torch_warmth", "colored_lights", "waving"]

[[pages]]
id = "sky"
name = "Sky and Air"
description = "Clouds, cloud shadows, haze and light shafts."
items = ["soft_clouds", "cloud_amount", "cloud_shadows", "haze", "volumetric_light", "rays"]

[[pages]]
id = "water"
name = "Water"
description = "Waves, clarity and reflections."
items = ["water_waves", "water_clarity", "reflections"]

[[pages]]
id = "image"
name = "Image"
description = "Exposure, colours, bloom and vignette."
items = ["exposure", "saturation", "bloom", "vignette"]

[[options]]
id = "quality"
name = "Quality"
description = "Low for weak PCs, Ultra for strong ones. Sets how finely clouds, light shafts, soft shadows, water and bloom are computed. High is the normal Lumen look."
type = "choice"
values = ["Low", "Medium", "High", "Ultra"]
default = "High"

[[options]]
id = "shadows"
name = "Shadows"
description = "Real shadows from the sun and moon. Turning them off saves the most performance."
type = "bool"
default = true

[[options]]
id = "shadow_quality"
name = "Shadow Resolution"
description = "How sharp shadows are: 1024 fast, 2048 normal, 4096 very sharp."
type = "choice"
values = ["1024", "2048", "3072", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow Distance"
description = "How many blocks around you get shadows. Farther costs more and makes shadows a bit blurrier at the same resolution."
type = "choice"
values = ["64", "96", "128", "192", "256"]
default = "128"

[[options]]
id = "anti_aliasing"
name = "Anti-Aliasing"
description = "Smooths jagged edges (Horizon's own anti-aliasing is off while a shader draws the picture)."
type = "bool"
default = true

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How strong direct sunlight is."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "shadow_softness"
name = "Soft Shadows"
description = "How soft shadow edges are."
type = "float"
default = 1.0
min = 0.25
max = 3.0
step = 0.25

[[options]]
id = "ambient_strength"
name = "Sky Light"
description = "How brightly the sky lights shaded sides."
type = "float"
default = 0.85
min = 0.25
max = 2.0
step = 0.05

[[options]]
id = "ambient_blue"
name = "Blue Shadows"
description = "How blue the sky light in shadows is."
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "torch_warmth"
name = "Torch Warmth"
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "colored_lights"
name = "Coloured Light"
description = "Soul torches glow blue, redstone red, amethyst purple and so on."
type = "bool"
default = true

[[options]]
id = "waving"
name = "Waving Plants"
description = "How much leaves, grass and flowers wave in the wind (0 = off)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "soft_clouds"
name = "Volumetric Clouds"
description = "Soft volumetric clouds instead of vanilla's block clouds (0 = no clouds)."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_amount"
name = "Cloud Amount"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_shadows"
name = "Cloud Shadows"
description = "Drifting cloud shadows on the ground."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "haze"
name = "Haze"
description = "Aerial perspective: distant mountains turn paler and bluer."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "volumetric_light"
name = "Volumetric Light"
description = "Visible light shafts in the air, for example between trees."
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "rays"
name = "Sun Rays"
description = "Rays around the sun in the sky."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_waves"
name = "Waves"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Water Clarity"
description = "How far you can see into the water."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Reflections"
description = "Blocks reflect in water (costs some performance)."
type = "bool"
default = true

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.06
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

