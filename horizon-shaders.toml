schema = 1
id = "lumen"
name = "Lumen"
version = "2.1.0"
api = "0.1"
description = "Gemuetlicher Shader im Stil von Photon: weiche Schatten, warmer Himmel, volumetrische Wolken, Lichtstrahlen, klares Wasser mit Spiegelungen, schoenes Unterwasser, wehende Pflanzen und farbiges Licht. Eigener Code."
authors = ["Lutziano888"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphaere"
clouds = false
sun = false

[vertex]
file = "vertex.wgsl"

[material]
file = "material.wgsl"
name = "Licht"
fog = false

[weather]
file = "weather.wgsl"
name = "Regen und Schnee"

[shadow]
resolution = 2048
distance = 128.0

[reflection]
option = "reflections"

[[post]]
file = "post/clouds.wgsl"
name = "Wolken"

[[post]]
file = "post/fog.wgsl"
name = "Luft und Lichtstrahlen"

[[post]]
file = "post/rays.wgsl"
name = "Sonnenstrahlen"

[[post]]
file = "post/bloom.wgsl"
name = "Bloom"

[[post]]
file = "post/grade.wgsl"
name = "Tonemapping"

# --- Optionen ---

[[pages]]
id = "main"
name = "Lumen"
items = ["page:light", "page:sky", "page:water", "page:image"]

[[pages]]
id = "light"
name = "Licht und Schatten"
description = "Sonne, Schatten, Himmelslicht, Fackeln und Pflanzen."
items = ["sun_strength", "shadow_softness", "ambient_strength", "ambient_blue", "torch_warmth", "colored_lights", "waving"]

[[pages]]
id = "sky"
name = "Himmel und Luft"
description = "Wolken, Wolkenschatten, Dunst und Lichtstrahlen."
items = ["soft_clouds", "cloud_amount", "cloud_shadows", "haze", "volumetric_light", "rays"]

[[pages]]
id = "water"
name = "Wasser"
description = "Wellen, Klarheit und Spiegelungen."
items = ["water_waves", "water_clarity", "reflections"]

[[pages]]
id = "image"
name = "Bild"
description = "Belichtung, Farben, Bloom und Vignette."
items = ["exposure", "saturation", "bloom", "vignette"]

[[options]]
id = "sun_strength"
name = "Sonnenlicht"
description = "Wie stark das direkte Sonnenlicht ist."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "shadow_softness"
name = "Weiche Schatten"
description = "Wie weich die Schattenkanten sind."
type = "float"
default = 1.0
min = 0.25
max = 3.0
step = 0.25

[[options]]
id = "ambient_strength"
name = "Himmelslicht"
description = "Wie hell Schattenseiten vom Himmel beleuchtet werden."
type = "float"
default = 0.85
min = 0.25
max = 2.0
step = 0.05

[[options]]
id = "ambient_blue"
name = "Blaue Schatten"
description = "Wie blau das Himmelslicht in den Schatten ist."
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "torch_warmth"
name = "Fackelwaerme"
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "colored_lights"
name = "Farbiges Licht"
description = "Seelenfackeln leuchten blau, Redstone rot, Amethyst lila und so weiter."
type = "bool"
default = true

[[options]]
id = "waving"
name = "Wehende Pflanzen"
description = "Wie stark Blaetter, Gras und Blumen im Wind wehen (0 = aus)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "soft_clouds"
name = "Volumetrische Wolken"
description = "Weiche, volumetrische Wolken statt Vanillas Block-Wolken (0 = keine Wolken)."
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_amount"
name = "Wolkenmenge"
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "cloud_shadows"
name = "Wolkenschatten"
description = "Ziehende Schatten der Wolken auf dem Boden."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "haze"
name = "Dunst"
description = "Luftperspektive: entfernte Berge werden blasser und blauer."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "volumetric_light"
name = "Volumetrisches Licht"
description = "Sichtbare Lichtstrahlen in der Luft, z. B. zwischen Baeumen."
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "rays"
name = "Sonnenstrahlen"
description = "Strahlen rund um die Sonne am Himmel."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_waves"
name = "Wellen"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Klares Wasser"
description = "Wie weit man ins Wasser hineinsieht."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "reflections"
name = "Spiegelungen"
description = "Bloecke spiegeln sich im Wasser (kostet etwas Leistung)."
type = "bool"
default = true

[[options]]
id = "exposure"
name = "Belichtung"
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "saturation"
name = "Saettigung"
type = "float"
default = 1.06
min = 0.0
max = 2.0
step = 0.02

[[options]]
id = "bloom"
name = "Bloom"
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

